schema_version: 1
units:
  slurm-prod:
    type: slurm
    enabled: true
    resource_pool_id: slurm-prod
    allowed_labels:
      - dsImaging
    allowed_runners: []
    config:
      # SHA-256 of the exact remote runtime/container/model bundle.
      runtime_revision: REPLACE_WITH_64_LOWERCASE_HEX
      slurm_sbatch: /usr/bin/sbatch
      slurm_squeue: /usr/bin/squeue
      slurm_sacct: /usr/bin/sacct
      slurm_scancel: /usr/bin/scancel
      slurm_sinfo: /usr/bin/sinfo
      slurm_partition: compute
      backend_path_mappings:
        - local: /srv/dshpc
          backend: /shared/dshpc

  # External units delegate all remote authentication and transport to these
  # server-owned wrappers. Never put keys or tokens in this YAML file.
  # cluster-a:
  #   type: external
  #   enabled: true
  #   resource_pool_id: cluster-a
  #   allowed_labels: [dsImaging]
  #   allowed_runners: []
  #   config:
  #     runtime_revision: REPLACE_WITH_64_LOWERCASE_HEX
  #     external_submit_cmd: /usr/local/libexec/dshpc/cluster-a-submit
  #     external_status_cmd: /usr/local/libexec/dshpc/cluster-a-status
  #     external_cancel_cmd: /usr/local/libexec/dshpc/cluster-a-cancel

  # k8s-gpu:
  #   type: kubernetes
  #   enabled: true
